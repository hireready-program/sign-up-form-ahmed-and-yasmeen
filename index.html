<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="left">
          <div class="logo-holder">
            <img src="./assets/images/odin-lined.png" alt="logo" />
            <p>ODIN</p>
          </div>
        </div>
        <div class="right">
          <div class="content-area">
            <p>
              This is no a real online service! you know you need something
              <br />
              like this in your life to help you realize your deepest dreams.<br />Sign-up
              <em>now</em> to get started!
            </p>
            <p>You <em>know</em> you want to.</p>
          </div>

          <form action="submit" method="post">
            <div class="inputs">
              <p>Let's do this!</p>
              <div class="inputs-grid">
                <div class="input">
                  <label for="first-name">FIRST NAME</label>
                  <input type="text" id="first-name" required />
                </div>

                <div class="input">
                  <label for="last-name">LAST NAME </label>
                  <input type="text" id="last-name" required/>
                </div>

                <div class="input">
                  <label for="email">EMAIL</label>
                  <input type="emial" id="email" required/>
                </div>
                <div class="input">
                  <label for="phone">PHONE NUMBER</label>
                  <input type="number" id="phone" required />
                </div>
                <div class="input">
                  <label for="password">PASSWORD</label>
                  <input type="password" id="password" required/>
                </div>
                <div class="input">
                  <label for="confirm-password">CONFIRM PASSWORD</label>
                  <input type="password" id="confirm-password" required />
                </div>
              </div>
            </div>
            <button type="submit" class="create-account">Create Account</button>
            <p class="have-account">
              Already have an account?<a href=""> Log in</a>
            </p>
          </form>
        </div>
        <div class="right"></div>
      </div>
    </main>
  </body>
</html>
